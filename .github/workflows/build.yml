name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    # Weekly rebuild to pick up Alpine security updates.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/tyrola/kubyl-debug
  ALPINE_LINE: "3.24"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.ALPINE_LINE }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      # Build the amd64 image into the local daemon first so it can be smoke tested.
      - name: Build (amd64, for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: kubyl-debug:test

      - name: Smoke test
        run: |
          docker run --rm kubyl-debug:test sh -c '
            set -e
            for bin in bash sleep tcpdump htop strace chroot mount nsenter ps ip curl; do
              command -v "$bin" || { echo "missing: $bin"; exit 1; }
            done
            tcpdump --version
            strace -V | head -1
            mount --version
          '
          # The banner shows for an interactive shell.
          docker run --rm -t -e NO_COLOR=1 kubyl-debug:test bash -lic exit | tee motd.txt
          grep -q "chroot /host" motd.txt

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
